name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner's bundled npm
      # may predate it. `changeset publish` shells out to `npm publish`.
      # Pinned to a major so a new npm release can't silently change the
      # output Changesets parses (npm 12's `npm info --json` did, breaking
      # @changesets/cli 2.x). Bump deliberately.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      # Opens/updates a "Version Packages" PR, or publishes when it is merged.
      # Publishing authenticates via npm trusted publishing (OIDC) — no token —
      # using the `id-token: write` permission above. Provenance is automatic.
      # changesets/action v2 pairs with @changesets/cli v3 (v1 is for cli v2).
      # It uses the job's GITHUB_TOKEN by default (`github-token` input).
      - name: Create Release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
